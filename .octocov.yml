coverage:
  paths:
    - coverage.out
  # The integration job fails when coverage drops below 95% (97.0% when this was set) or falls by
  # more than one point against the latest report from main. Without a report from main to compare
  # with, only the floor applies.
  acceptable: current >= 95% && diff >= -1%
report:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
  if: is_default_branch
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
  if: is_pull_request
comment:
  if: is_pull_request
