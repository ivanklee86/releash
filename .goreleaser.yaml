# Release build for spec 0002 (docs/specs/0002-distribution.md). .github/workflows/release.yaml runs
# it on v* tags; ci.yaml's release-check job runs it as a snapshot on every pull request.
version: 2

project_name: releash

builds:
  - id: releash
    binary: releash
    env:
      # Static binaries: the image's distroless base has no libc, and nothing here needs cgo.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Spec 0002 ships Windows on amd64 only.
      - goos: windows
        goarch: arm64
    ldflags:
      # .Version has no leading v (0.1.0), matching the archive and image names.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: releash
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Listed explicitly so goreleaser's default globs cannot pull in other files.
    files:
      - LICENSE
      - README.md

sboms:
  # One SPDX JSON SBOM per archive, named <archive>.sbom.json, generated with syft.
  - artifacts: archive

checksum:
  # checksums.txt lists the archives and their SBOMs, so signing it covers all of them.
  name_template: checksums.txt
  algorithm: sha256

signs:
  # cosign keyless signing (ADR 0005): the release workflow's OIDC token identifies it to Fulcio.
  # A snapshot does not skip this pipe on its own, so snapshots run with --skip=sign.
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

dockers_v2:
  # Built with buildx as one multi-arch manifest at publish time. A snapshot instead builds one local
  # image per platform, tagged <version>-amd64 and <version>-arm64, without pushing.
  - id: releash
    ids:
      - releash
    images:
      - ghcr.io/ivanklee86/releash
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.source": "https://github.com/ivanklee86/releash"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MPL-2.0"
    # The image SBOM is a cosign attestation added by release.yaml (spec 0002), not a BuildKit
    # attestation, so users verify one signed SBOM.
    sbom: "false"

docker_signs:
  # Signs each pushed image by digest, keylessly. This runs in the publish phase, which snapshots skip.
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

homebrew_casks:
  - name: releash
    homepage: "https://github.com/ivanklee86/releash"
    description: "Drive CI/CD changes with Unleash feature flags"
    directory: Casks
    binaries:
      - releash
    # Prereleases (v0.1.0-rc.1) are not published to the tap.
    skip_upload: auto
    # The binaries are not notarized, so Gatekeeper quarantines them on download and refuses to run
    # them. Strip the attribute after staging, as argonap's cask does.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/releash"]
          end
    repository:
      owner: ivanklee86
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_AUTH_TOKEN }}"

changelog:
  # GitHub's generated release notes, grouped by the labels in .github/release.yml.
  use: github-native

release:
  # Tags with a prerelease suffix (v0.1.0-rc.1) become GitHub prereleases.
  prerelease: auto
