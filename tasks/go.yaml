# https://taskfile.dev
version: '3'

vars:
  BUILD_DIR: bin

tasks:
  install:
    desc: Download Go module dependencies.
    cmds:
      - go mod download

  install-ci:
    desc: Install Go dependencies and CI tools.
    cmds:
      - task: install
      # Pinned to the version in ghcr.io/ivanklee86/devcontainer/go, so CI and the devcontainer agree.
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

  fmt:
    desc: Format Go code with the formatters in .golangci.yml (gofmt and goimports).
    cmds:
      - golangci-lint fmt

  lint:
    desc: Lint Go code.
    cmds:
      - golangci-lint run --timeout 5m

  build:
    desc: Build the releash binary into bin/.
    # No -ldflags version: local builds report the VCS pseudo-version from build info. Release builds inject it (M5).
    cmds:
      - go build -o {{.BUILD_DIR}}/ .

  test:
    desc: Run Go tests.
    cmds:
      - go test -v ./...
