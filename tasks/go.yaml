# https://taskfile.dev
version: '3'

vars:
  BUILD_DIR: bin
  TEST_REPORT: report.xml
  COVERAGE_RAW: coverage.out

tasks:
  install:
    desc: Download Go module dependencies.
    cmds:
      - go mod download

  install-ci:
    desc: Install Go dependencies and CI tools.
    cmds:
      - task: install
      - go install github.com/jstemmer/go-junit-report/v2@v2.1.0
      # Pinned to the version in ghcr.io/ivanklee86/devcontainer/go, so CI and the devcontainer agree.
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

  fmt:
    desc: Format Go code with the formatters in .golangci.yml (gofmt and goimports).
    cmds:
      - golangci-lint fmt

  lint:
    desc: Lint Go code.
    cmds:
      - golangci-lint run --timeout 5m

  build:
    desc: Build the releash binary into bin/.
    # No -ldflags version: local builds report the VCS pseudo-version from build info. Release builds inject it (M5).
    cmds:
      - go build -o {{.BUILD_DIR}}/ .

  test:
    desc: Run unit tests. They need neither Docker nor network access.
    cmds:
      - go test -v ./...

  # -count=1: the results depend on the stack, which go test's cache cannot see.
  test-integration:
    desc: Run unit and integration tests against the local Unleash stack (start it with task services).
    cmds:
      - go test -tags integration -count=1 -v ./...

  test-ci:
    desc: Run unit and integration tests, and write a JUnit report and a coverage profile.
    vars:
      # Product packages only: internal/integration holds test helpers.
      COVER_PACKAGES:
        sh: go list -tags integration ./... | grep -v /internal/integration | paste -sd, -
    # go-junit-report copies the test output to stdout (-iocopy) and exits 1 if a test failed (-set-exit-code).
    # pipefail also fails the task when go test fails without a failing test, e.g. on a build error.
    set: [pipefail]
    cmds:
      - go test -tags integration -count=1 -coverpkg={{.COVER_PACKAGES}} -coverprofile {{.COVERAGE_RAW}} -v ./... 2>&1 | go-junit-report -iocopy -set-exit-code -out {{.TEST_REPORT}}
