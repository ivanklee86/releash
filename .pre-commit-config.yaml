repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Generated by gantry without a trailing newline.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # golangci-lint comes from the devcontainer image, which pins its version.
  - repo: local
    hooks:
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: (\.go|go\.mod|go\.sum)$
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 45.1.1
    hooks:
      - id: renovate-config-validator
        # Without --no-global it checks renovate.json as self-hosted global config, not repo config.
        args: [--strict, --no-global]
