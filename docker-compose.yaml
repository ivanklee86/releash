# Local Unleash for trying releash by hand and for integration tests. Start it with `task services`.
# The tokens below are fixed dev-only values and are not secret.
name: releash

services:
  db:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the image initialises a new volume, a temporary server answers on the Unix socket only.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=unleash", "--dbname=unleash"]
      interval: 2s
      timeout: 5s
      retries: 30

  unleash:
    # Upgrade together with unleash/seed.py, which uses the Admin API of this version.
    image: unleashorg/unleash-server:8.3.1@sha256:025cd8b003a70cceb88427ca393c377ca6503a210d95fdee54d21610d51f7ed0
    restart: on-failure
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: postgres://unleash:unleash@db:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      CHECK_VERSION: "false"
      SEND_TELEMETRY: "false"
      INIT_ADMIN_API_TOKENS: "*:*.releash-dev-admin-not-a-secret"
      INIT_BACKEND_API_TOKENS: "default:development.releash-dev-not-a-secret,default:production.releash-dev-not-a-secret"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4242/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Creates the fixture flags in unleash/fixtures.json. It is idempotent; `task services` runs it with
  # `docker compose run`, so its exit code is the task's.
  seed:
    image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    command: ["python", "-I", "/unleash/seed.py"]
    environment:
      UNLEASH_SERVER_URL: http://unleash:4242
      UNLEASH_ADMIN_TOKEN: "*:*.releash-dev-admin-not-a-secret"
    volumes:
      - ./unleash:/unleash:ro
    depends_on:
      unleash:
        condition: service_healthy

volumes:
  db-data:
