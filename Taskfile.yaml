# https://taskfile.dev
version: '3'

includes:
  go: ./tasks/go.yaml
  release: ./tasks/release.yaml
  unleash:
    taskfile: ./tasks/unleash.yaml
    flatten: true

tasks:
  default:
    desc: Format, lint, build and test.
    cmds:
      - task: go:fmt
      - task: go:lint
      - task: go:build
      - task: go:test
