name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

# Cancel superseded PR runs. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No job pushes with git, so the token stays out of .git/config.
        persist-credentials: false
    - name: Install Go
      id: setup-go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Check formatting
      run: |
        gofmt -d .
        test -z "$(gofmt -l .)"
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Cache Go tool binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        # The binaries depend on the tool versions in tasks/go.yaml and on the Go toolchain that
        # built them. os/arch keep them from crossing runners.
        key: go-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('tasks/go.yaml') }}
    - name: Install CI tools
      run: task go:install-ci
    - name: Lint code
      run: task go:lint
    - name: Compile code
      run: task go:build
    - name: Test the Claude Code hooks
      run: task claude:test-hooks
    - name: Check that go.mod and go.sum are tidy
      run: go mod tidy -diff

  test:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Download dependencies
      # Tests need no CI tools, so this job skips go:install-ci and the tool cache.
      run: task go:install
    - name: Run tests
      run: task go:test

  pre-commit:
    runs-on: ubuntu-26.04
    env:
      # The lint job runs the same checks (golangci-lint fmt and run, go mod tidy -diff), and these
      # hooks are `language: system`, so they would need Go and golangci-lint installed here too. The
      # lint job also runs the claude-hooks tests, which need golangci-lint.
      SKIP: golangci-lint-fmt,golangci-lint,go-mod-tidy,claude-hooks
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run prek hooks
      uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
      with:
        prek-version: v0.5.12 # github-releases/j178/prek

  integration:
    # Unit and integration tests against the compose stack, with a JUnit report and coverage.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write         # publish-unit-test-result-action's check run
      pull-requests: write  # its PR comment, and octocov's
      actions: write        # octocov's artifact:// datastore, and deleting earlier runs' report pages
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      id: setup-go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Cache Go tool binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        # Its own key: this job installs only go-junit-report, and sharing the lint job's key would
        # make the two race to save different contents.
        key: go-test-tools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('tasks/go.yaml') }}
    - name: Install test tools
      run: task go:install-test-ci
    - name: Start the local Unleash stack
      run: task services
    - name: Run unit and integration tests
      run: task go:test-ci
    - name: Dump compose logs on failure
      # The stack is gone once the job ends, so this is the only chance to see why.
      if: failure()
      run: docker compose logs --no-color --timestamps
    - name: Publish test results
      # SHA-pinned, like octocov below: this step runs with checks and pull-requests write. It runs
      # after a test failure, but not on a cancelled run or before report.xml exists. Pull requests
      # from forks get a read-only token whatever the job asks for, so reporting is skipped there.
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
      if: ${{ !cancelled() && hashFiles('report.xml') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
      with:
        files: report.xml
        check_name: Test Results
    - name: Report coverage via octocov
      # Only after tests pass (no `if: always()`), so a failed run never becomes the baseline that
      # other PRs diff against. Skipped on fork pull requests, like the step above. SHA-pinned: this
      # step runs with actions write, which octocov needs to delete the report pages of earlier runs.
      uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
      if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      with:
        config: .octocov.yml
        version: v0.83.5 # github-releases/k1LoW/octocov

  release-check:
    # Builds what release.yaml publishes, without signing or pushing: every archive and its SBOM,
    # checksums.txt and both image platforms. Without it, a broken .goreleaser.yaml or Dockerfile
    # passes every pull request check and fails only once a tag exists.
    runs-on: ubuntu-26.04
    env:
      GORELEASER_VERSION: v2.20.3 # github-releases/goreleaser/goreleaser
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # goreleaser reads the tags to work out the version.
        fetch-depth: 0
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        # Built from a clean module cache, like release.yaml, so this job checks the build a tag gets.
        cache: false
    - name: Install Task
      uses: ./.github/actions/setup-task
    - name: Install syft
      # goreleaser runs syft for the archive SBOMs.
      uses: ./.github/actions/setup-syft
    - name: Set up QEMU
      # For the arm64 image build and its smoke test. The binaries themselves are cross-compiled by Go.
      # The binfmt image is set because the action otherwise pulls its floating latest tag.
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
    - name: Set up Docker Buildx
      # The BuildKit image is set because the docker-container driver otherwise starts its floating default.
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
    - name: Install goreleaser
      # Install only, so the snapshot runs through the same task, and flags, as a local one.
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: ${{ env.GORELEASER_VERSION }}
        install-only: true
    - name: Snapshot release
      run: task release:snapshot
    - name: Smoke-test the linux/amd64 binary and both images
      run: task release:smoke-test

  release-notes:
    # A snapshot never calls GitHub's release-notes API, so .github/release.yml is checked statically
    # against the categories and labels in spec 0002. yq and jq are preinstalled on the runner.
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check .github/release.yml against spec 0002
      run: |
        expected='{"changelog":{"categories":[
          {"title":"Breaking changes","labels":["breaking-change"]},
          {"title":"Features","labels":["enhancement"]},
          {"title":"Bug fixes","labels":["bug"]},
          {"title":"Dependencies","labels":["dependencies"]},
          {"title":"Other changes","labels":["*"]}
        ]}}'
        actual=$(yq --output-format=json '.' .github/release.yml)
        if ! jq --exit-status --null-input --argjson a "${actual}" --argjson e "${expected}" '$a == $e' > /dev/null; then
          echo "::error file=.github/release.yml::does not match the release notes categories in docs/specs/0002-distribution.md"
          diff <(jq --sort-keys . <<< "${expected}") <(jq --sort-keys . <<< "${actual}") || true
          exit 1
        fi
