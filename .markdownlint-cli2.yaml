config:
  default: true
  # Docs use full-length lines (AGENTS.md), and CLI help output in code fences runs long.
  MD013: false
  # Specs, ADRs and milestones repeat headings such as "Consequences" under different parents.
  MD024:
    siblings_only: true
  # Specs follow the Rust RFC template, which starts with a metadata list rather than a heading.
  MD041: false
  # Every table in the repository uses compact `|---|---|` delimiter rows.
  MD060: false
